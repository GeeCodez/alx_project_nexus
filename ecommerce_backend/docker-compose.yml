services:
  redis:
    image: redis:latest
    container_name: project_nexus_redis_cache
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: project_nexus_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - project_nexus_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: project_nexus_rabbitmq
    ports:
      - "5672:5672"     # Broker
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    # healthcheck:
    #   test: ["CMD", "rabbitmq-diagnostics", "ping"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

volumes:
  project_nexus_data:
  rabbitmq_data: