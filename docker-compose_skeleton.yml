version: "3.9"

services:
  web:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    env_file:
      - .env

  redis:
    image: redis:7

  celery_worker:
    build: .
    command: celery -A core worker -l info
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    command: celery -A core beat -l info
    depends_on:
      - redis
      - db